[project]
name = "nes"
version = "0.0.0"
description = "Package Implementing Natural Evolution Strategies for general Black Box Models."
authors = [
    {name = "Christof Stein",email = "christof.stein@student.uibk.ac.at"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy (>=2.2.4,<3.0.0)",
    "pre-commit (>=4.2.0,<5.0.0)",
    "pytest (>=8.3.5,<9.0.0)",
    "scipy (>=1.15.2,<2.0.0)",
    "matplotlib (>=3.10.1,<4.0.0)"
]

[tool.poetry]
packages = [
    { include = "nes", from = "src" }
]

[tool.ruff.lint]
select = ["E", "F", "B", "W", "Q"]
ignore = ["E501"]
[tool.pytest.ini_options]
pythonpath = [
  ".",
  "tests",
]

[tool.poetry.group.dev.dependencies]
numba = "^0.61.0"
ipykernel = "^6.29.5"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
